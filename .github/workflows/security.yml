name: Security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Catch newly-disclosed vulnerabilities in dependencies even when the
    # repo has no other changes. Runs weekly on Monday at 07:00 UTC.
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  vuln:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable

      - name: Run cargo audit
        # Fails on a vulnerability with a fix available. An advisory with no
        # released patch is reported by the action but does not fail the job,
        # since occonfig cannot do anything about a transitive crate's CVE.
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
